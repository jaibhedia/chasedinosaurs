# Render Blueprint for the Chase Dinosaurs Socket.IO server.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# This is the BACKEND only. The web app deploys separately (see vercel.json).
# They must know about each other:
#   - here:  CORS_ORIGIN = the site URL (plus capacitor://localhost for the iOS app,
#            https://localhost for the Android app)
#   - site:  its socket URL setting = this service's URL
# Get either wrong and the lobby loads but never connects.
#
# Region: players are spread across Europe, Southeast Asia and the US, so Frankfurt is
# the best single-region compromise. See ROADMAP.md (M6) for going multi-region.
#
# `sync: false` means "prompt me in the dashboard" — secrets never live in this file.
services:
  - type: web
    name: chase-dinosaurs
    runtime: node
    region: frankfurt
    # The free plan spins down after ~15 minutes idle and cold-starts in ~50s, so the
    # first match after a quiet spell takes a minute to start. Use `starter` for launch.
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically and the server reads process.env.PORT —
      # do NOT hardcode it here or the health check can't reach the service.
      - key: NODE_ENV
        value: production

      # Comma-separated allowed browser origins.
      - key: CORS_ORIGIN
        sync: false

      # --- AI provider: bot personalities and taunts -------------------------
      # Any OpenAI-compatible endpoint. Unset, the bots still play on local tactics
      # and simply don't talk.
      - key: AI_BASE_URL
        sync: false
      # SECRET.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # --- All-time leaderboard ------------------------------------------------
      # Kept in Upstash Redis when both of these are set (free tier at upstash.com: create a
      # Redis database, then copy its REST URL and token). /health shows
      # leaderboard.store = "upstash" once they're picked up.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      # SECRET.
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Without Upstash: the folder for leaderboard.json (default: ./data). The free plan wipes
      # it on every restart, deploy and idle sleep; it only lasts on a paid plan's persistent disk.
      - key: DATA_DIR
        sync: false

      # --- World ID: verified humans only on the all-time board ------------------
      # From the World Developer Portal (developer.world.org): create an app, enable World ID
      # 4.0, and create the action "chase-leaderboard" in the production environment.
      # Unset: World ID is off and everyone ranks, as before.
      - key: WORLD_APP_ID
        sync: false
      - key: WORLD_RP_ID
        sync: false
      # SECRET. The RP signing key.
      - key: WORLD_RP_SIGNING_KEY
        sync: false

      # --- Admin spectator mode (/admin) ------------------------------------------
      # Comma-separated admin emails. Unset: nobody can spectate.
      - key: ADMIN_EMAILS
        sync: false
      # SECRET. Required alongside the email; without it, an email alone gets in.
      - key: ADMIN_PASSCODE
        sync: false
