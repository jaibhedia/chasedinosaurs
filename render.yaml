# Render Blueprint for the Chase Dinosaurs Socket.IO server.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# This is the BACKEND only. The web app deploys separately (see vercel.json).
# They must know about each other:
#   - here:  CORS_ORIGIN = the site URL (plus capacitor://localhost for the iOS app,
#            https://localhost for the Android app)
#   - site:  its socket URL setting = this service's URL
# Get either wrong and the lobby loads but never connects.
#
# Region: players are spread across Europe, Southeast Asia and the US, so Frankfurt is
# the best single-region compromise. See ROADMAP.md (M6) for going multi-region.
#
# `sync: false` means "prompt me in the dashboard" — secrets never live in this file.
services:
  - type: web
    name: chase-dinosaurs
    runtime: node
    region: frankfurt
    # The free plan spins down after ~15 minutes idle and cold-starts in ~50s, so the
    # first match after a quiet spell takes a minute to start. Use `starter` for launch.
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically and the server reads process.env.PORT —
      # do NOT hardcode it here or the health check can't reach the service.
      - key: NODE_ENV
        value: production

      # Comma-separated allowed browser origins.
      - key: CORS_ORIGIN
        sync: false

      # --- AI provider: bot personalities and taunts -------------------------
      # Any OpenAI-compatible endpoint. Unset, the bots still play on local tactics
      # and simply don't talk.
      - key: AI_BASE_URL
        sync: false
      # SECRET.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # --- All-time leaderboard ------------------------------------------------
      # Folder for leaderboard.json (default: ./data). The free plan's disk is wiped on
      # every restart and deploy; attach a persistent disk and set this to its mount path.
      - key: DATA_DIR
        sync: false
